name: Testes Unitários - Endy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restaurar dependências
      run: dotnet restore
      working-directory: ./

    - name: Compilar projeto
      run: dotnet build --no-restore --configuration Release
      working-directory: ./

    - name: Executar testes unitários
      run: dotnet test endyWeb/endyWeb.csproj --no-build --logger "console;verbosity=minimal" --collect:"XPlat Code Coverage"
      working-directory: ./

    - name: Publicar resultados de cobertura
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Gerar relatório de testes
      if: always()
      run: dotnet test endyWeb/endyWeb.csproj --no-build --logger "trx;LogFileName=test-results.trx"
      working-directory: ./

    - name: Upload de artefatos de teste
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./test-results.trx
